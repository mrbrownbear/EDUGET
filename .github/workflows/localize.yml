name: Localize Getty clone

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble localizer
        run: |
          mkdir -p scripts
          cat .bootstrap/part0 .bootstrap/part1 .bootstrap/part2 | base64 -d > scripts/bootstrap.py
          python3 -m py_compile scripts/bootstrap.py

      - name: Build fully local static copy
        run: python3 scripts/bootstrap.py

      - name: Remove temporary bootstrap data
        run: rm -rf .bootstrap

      - name: Commit localized site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Localize Getty assets and disable live runtime calls"
          git push origin main
